name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build package
        run: npm run build
      
      - name: Run tests
        run: npm run type-check
      
      - name: Check version change
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Check if tag already exists
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "Tag v$CURRENT_VERSION already exists"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "New version v$CURRENT_VERSION - will create release"
          fi
      
      - name: Create Release
        if: steps.version-check.outputs.version_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version-check.outputs.current_version }}"
          
          # Create and push tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          
          # Create GitHub release
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Release $VERSION

          ## Installation

          \`\`\`bash
          npm install github:orstrax/orstrax-ui#$VERSION
          \`\`\`

          Or in package.json:

          \`\`\`json
          {
            \"dependencies\": {
              \"@orstrax/ui\": \"github:orstrax/orstrax-ui#$VERSION\"
            }
          }
          \`\`\`

          ## Changes

          See commits since last release for details."
      
      - name: Skip release
        if: steps.version-check.outputs.version_changed == 'false'
        run: echo "No version change detected. Bump version in package.json to create a release."
