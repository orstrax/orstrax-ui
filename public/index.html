<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orstrax UI</title>
    <link rel="stylesheet" href="/theme/current/orstrax.css" />
    <style>
      body { margin: 0; padding: 3rem 1.5rem; }
      main { max-width: 40rem; margin: 0 auto; }
      code { font-size: 0.9em; }
    </style>
  </head>
  <body class="orstrax-app">
    <main>
      <p class="orstrax-kicker">Orstrax UI</p>
      <h1 class="orstrax-display orstrax-heading">Runtime theme host</h1>
      <p class="orstrax-subheading">Canonical Orstrax visual identity for branded applications.</p>
      <div class="orstrax-card" style="margin-top: 1.5rem; padding: 1.25rem;">
        <p>Versioned stylesheet: <code>/theme/v1.0.0/orstrax.css</code></p>
        <p>Promoted current: <code>/theme/current/orstrax.css</code></p>
        <p>Wordmark: <code>/assets/orstrax-wordmark.png</code></p>
        <p>Mark: <code>/assets/orstrax-mark.png</code></p>
      </div>
      <p style="margin-top: 1.5rem;">
        <img src="/assets/orstrax-wordmark.png" alt="Orstrax" height="36" />
      </p>
    </main>
  </body>
</html>
